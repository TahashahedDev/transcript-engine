[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-engine"
version = "0.1.0"
description = "Production-quality local AI meeting transcription engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Core ML
    "faster-whisper>=1.1.0,<2.0",
    # whisperx and pyannote must be pinned as a pair.
    #
    # The diarization code targets the pyannote 3.x API: the private
    # `_segmentation` handle used to set the segmentation step, the
    # hf_hub_download shim in model_registry, and the `speaker-diarization-3.1`
    # pipeline itself. whisperx changed its own requirement from
    # `pyannote-audio<4.0` to `>=4.0` at version 3.8.0, so leaving whisperx
    # unbounded drags pyannote 4.x in behind it — untested here, and it also
    # switches pyannote's audio decoding to torchcodec.
    #
    # An unbounded range does not fail at install time; it fails on whichever
    # fresh GPU box happens to resolve differently from the machine this was
    # developed on. Pin both, together.
    "whisperx>=3.7.0,<3.8",
    "pyannote.audio>=3.3.2,<4.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "librosa>=0.10.0",

    # Audio
    "ffmpeg-python>=0.2.0",

    # Data / Config
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "PyYAML>=6.0",

    # CLI / UX
    "typer>=0.12.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",

    # Observability
    "psutil>=5.9.0",

    # Fuzzy matching for vocabulary processor
    "rapidfuzz>=3.6.0",

    # Export
    "python-docx>=1.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cloud storage + auth
    "boto3>=1.34.0",
    "PyJWT>=2.8.0",

    # API server
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",

    # OpenAI-compatible client for the optional AI grammar pass
    # (processors/ai_grammar.py) and meeting-intelligence LLM backend
    # (intelligence/ai_backend.py). Works against any OpenAI-compatible
    # endpoint, including a local Ollama server — not just OpenAI itself.
    "openai>=1.30.0,<2.0",
]

[project.optional-dependencies]
denoise = ["noisereduce>=3.0.0"]
# NVIDIA NeMo backend — install to use TE_ASR_BACKEND=parakeet
# Requires CUDA. Install on GPU machines: pip install ".[nvidia]"
nvidia = ["nemo_toolkit[asr]>=1.23.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML",
    "httpx2>=0.28.0",
]

[project.scripts]
transcript-engine = "transcript_engine.cli.app:app"
te = "transcript_engine.cli.app:app"

[project.entry-points."transcript_engine.processors"]
# External plugins register here

[tool.setuptools.packages.find]
where = ["."]
include = ["transcript_engine*", "db*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Ruff lints notebooks by default. These two are backend-comparison demos where
# a configuration cell deliberately precedes the imports, so E402/I001 fire on
# the intended structure rather than on a defect. Excluded rather than silenced
# rule-by-rule; the notebooks are reference material, not shipped code.
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# E501: line-length enforced by formatter not linter
# B008: FastAPI Depends/Security/Form in defaults is the standard injection pattern
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: requires real ML models — run with RUN_SLOW_TESTS=1",
    "integration: integration tests requiring a live database (set TE_DATABASE_URL)",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["transcript_engine"]
omit = ["tests/*"]
